<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART PARKING // 2 Bays</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="paw-pattern-overlay"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">P</span>
      <div class="brand-text">
        <h1>SMART PARKING</h1>
        <span class="brand-sub">ESP32 · REAL-TIME MONITOR</span>
      </div>
    </div>
    <div class="topbar-status">
      <div class="clock" id="clock">--:--:--</div>
      <div class="link-state">
        <span class="dot" id="linkDot"></span>
        <span id="linkLabel">กำลังเชื่อมต่อ...</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- ผังพื้นที่จอดรถ -->
    <section class="panel schematic-panel">
      <div class="panel-head">
        <span class="eyebrow">🚗 ผังพื้นที่จอดรถ (2 ช่อง)</span>
        <span class="available-pill" id="availablePill">-- / -- ว่าง</span>
      </div>
      
      <svg viewBox="0 0 540 320" class="schematic">
        <!-- ทางเดินรถ -->
        <rect x="0" y="140" width="540" height="40" class="road"/>
        <line x1="0" y1="160" x2="540" y2="160" class="road-dash"/>

        <!-- ช่องที่ 1 -->
        <g id="bay1">
          <rect x="70" y="30" width="150" height="100" class="bay-outline"/>
          <text x="145" y="20" text-anchor="middle" class="bay-label">ช่องที่ 1</text>
          <circle cx="145" cy="40" r="4" class="sensor-dot"/>
          <line x1="145" y1="44" x2="145" y2="120" class="sensor-beam" id="beam1"/>
          
          <!-- กราฟิกรูปรถ ช่อง 1 -->
          <g id="car1" class="car" opacity="0">
            <rect x="105" y="50" width="80" height="60" rx="12" class="car-body"/>
            <rect x="115" y="60" width="60" height="40" rx="6" class="car-glass"/>
            <circle cx="103" cy="58" r="3" class="car-light"/>
            <circle cx="187" cy="58" r="3" class="car-light"/>
          </g>
          <text x="145" y="150" text-anchor="middle" class="bay-status" id="status1">--</text>
        </g>

        <!-- ช่องที่ 2 -->
        <g id="bay2">
          <rect x="320" y="30" width="150" height="100" class="bay-outline"/>
          <text x="395" y="20" text-anchor="middle" class="bay-label">ช่องที่ 2</text>
          <circle cx="395" cy="40" r="4" class="sensor-dot"/>
          <line x1="395" y1="44" x2="395" y2="120" class="sensor-beam" id="beam2"/>
          
          <!-- กราฟิกรูปรถ ช่อง 2 -->
          <g id="car2" class="car" opacity="0">
            <rect x="355" y="50" width="80" height="60" rx="12" class="car-body"/>
            <rect x="365" y="60" width="60" height="40" rx="6" class="car-glass"/>
            <circle cx="353" cy="58" r="3" class="car-light"/>
            <circle cx="437" cy="58" r="3" class="car-light"/>
          </g>
          <text x="395" y="150" text-anchor="middle" class="bay-status" id="status2">--</text>
        </g>

        <!-- ป้าย FULL -->
        <g id="fullBanner" class="full-banner" opacity="0">
          <rect x="120" y="200" width="300" height="60" class="full-banner-bg"/>
          <text x="270" y="238" text-anchor="middle" class="full-banner-text">⚠️ ที่จอดรถเต็มแล้ว</text>
        </g>
      </svg>
    </section>

    <!-- ข้อมูลระยะเซ็นเซอร์ -->
    <section class="panel readout-panel">
      <div class="panel-head"><span class="eyebrow">📡 ระยะเซ็นเซอร์</span></div>
      <div class="readouts">
        <div class="readout-card" id="card1">
          <span class="readout-label">ช่องที่ 1</span>
          <span class="readout-value"><span id="dist1">--</span><small>cm</small></span>
          <span class="readout-tag" id="tag1">รอข้อมูล</span>
        </div>
        <div class="readout-card" id="card2">
          <span class="readout-label">ช่องที่ 2</span>
          <span class="readout-value"><span id="dist2">--</span><small>cm</small></span>
          <span class="readout-tag" id="tag2">รอข้อมูล</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    อัปเดตล่าสุด: <span id="lastUpdate">--</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
