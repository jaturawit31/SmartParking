<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SMART PARKING</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="paw-pattern-overlay"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">P</span>
      <div class="brand-text">
        <h1>SMART PARKING</h1>
        <span class="brand-sub">ESP32 · ULTRASONIC REALTIME MONITOR</span>
      </div>
    </div>
    <div class="topbar-status">
      <div class="clock" id="clock">--:--:--</div>
      <div class="link-state">
        <span class="dot" id="linkDot"></span>
        <span id="linkLabel">SYSTEM OFFLINE</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel schematic-panel">
      <div class="panel-head">
        <span class="eyebrow">🚗 ผังจำลองสถานะช่องจอดรถ</span>
        <span class="available-pill" id="availablePill">-- / -- AVAILABLE</span>
      </div>
      
      <!-- SVG กราฟิกระบบที่จอดรถ -->
      <svg viewBox="0 0 540 300" class="schematic">
        <!-- ถนนด้านล่าง + ลูกศรเดินรถ -->
        <rect x="0" y="210" width="540" height="90" fill="#0b0f19"/>
        <line x1="0" y1="255" x2="540" y2="255" class="road-dash"/>
        <text x="270" y="280" text-anchor="middle" fill="#334155" font-size="12" font-family="JetBrains Mono" font-weight="700">LANE - ONE WAY ▶▶▶</text>

        <!-- ================= ช่องจอดที่ 1 (BAY 01) ================= -->
        <g id="bay1">
          <!-- พื้นช่องจอด + เส้นขอบสีเหลือง/จราจร -->
          <rect x="50" y="10" width="180" height="180" fill="#141c2e" stroke="#1e293b" stroke-width="2" rx="6"/>
          <line x1="50" y1="10" x2="50" y2="190" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6"/>
          <line x1="230" y1="10" x2="230" y2="190" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6"/>
          <line x1="50" y1="10" x2="230" y2="10" stroke="#334155" stroke-width="4"/>
          
          <!-- ข้อความและหมายเลขช่อง -->
          <text x="140" y="35" text-anchor="middle" class="bay-label" fill="#f1f5f9" font-weight="800">ที่จอด 1</text>
          <text x="140" y="50" text-anchor="middle" fill="#475569" font-size="10" font-family="JetBrains Mono">(SENDER 1)</text>

          <!-- ไอคอนเซ็นเซอร์ด้านบนช่อง -->
          <rect x="125" y="58" width="30" height="10" rx="3" fill="#0f172a" stroke="#00f2fe" stroke-width="1"/>
          <circle cx="140" cy="63" r="3" class="sensor-dot"/>
          <line x1="140" y1="68" x2="140" y2="175" class="sensor-beam" id="beam1"/>

          <!-- รูปรถ Top-View สไตล์ Local (ช่อง 1) -->
          <g id="car1" class="car" opacity="0">
            <!-- ล้อรถ 4 ข้าง -->
            <rect x="91" y="85" width="6" height="20" rx="2" fill="#0f172a"/>
            <rect x="183" y="85" width="6" height="20" rx="2" fill="#0f172a"/>
            <rect x="91" y="145" width="6" height="20" rx="2" fill="#0f172a"/>
            <rect x="183" y="145" width="6" height="20" rx="2" fill="#0f172a"/>
            
            <!-- โครงสร้างตัวรถมนโค้ง -->
            <rect x="96" y="72" width="88" height="110" rx="24" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
            <!-- ตัวถังหลังคา -->
            <rect x="106" y="90" width="68" height="68" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
            <!-- กระจกหน้ามนโค้ง -->
            <path d="M 112 118 C 112 100, 168 100, 168 118 Z" fill="#38bdf8" opacity="0.85"/>
            <!-- กระจกหลังมนโค้ง -->
            <path d="M 115 142 L 165 142 C 165 152, 115 152, 115 142 Z" fill="#38bdf8" opacity="0.5"/>
            <!-- ไฟหน้าคู่ LED -->
            <circle cx="112" cy="76" r="4" fill="#fff" filter="drop-shadow(0 0 6px #fff)"/>
            <circle cx="168" cy="76" r="4" fill="#fff" filter="drop-shadow(0 0 6px #fff)"/>
            <!-- ไฟท้าย -->
            <rect x="106" y="178" width="18" height="3" rx="1.5" fill="#ef4444" filter="drop-shadow(0 0 3px #ef4444)"/>
            <rect x="156" y="178" width="18" height="3" rx="1.5" fill="#ef4444" filter="drop-shadow(0 0 3px #ef4444)"/>
          </g>

          <!-- ข้อความสถานะด้านล่างช่อง -->
          <text x="140" y="202" text-anchor="middle" class="bay-status" id="status1">--</text>
        </g>

        <!-- ================= ช่องจอดที่ 2 (BAY 02) ================= -->
        <g id="bay2">
          <!-- พื้นช่องจอด + เส้นขอบสีเหลือง/จราจร -->
          <rect x="310" y="10" width="180" height="180" fill="#141c2e" stroke="#1e293b" stroke-width="2" rx="6"/>
          <line x1="310" y1="10" x2="310" y2="190" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6"/>
          <line x1="490" y1="10" x2="490" y2="190" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6"/>
          <line x1="310" y1="10" x2="490" y2="10" stroke="#334155" stroke-width="4"/>
          
          <!-- ข้อความและหมายเลขช่อง -->
          <text x="400" y="35" text-anchor="middle" class="bay-label" fill="#f1f5f9" font-weight="800">ที่จอด 2</text>
          <text x="400" y="50" text-anchor="middle" fill="#475569" font-size="10" font-family="JetBrains Mono">(SENDER 2)</text>

          <!-- ไอคอนเซ็นเซอร์ด้านบนช่อง -->
          <rect x="385" y="58" width="30" height="10" rx="3" fill="#0f172a" stroke="#00f2fe" stroke-width="1"/>
          <circle cx="400" cy="63" r="3" class="sensor-dot"/>
          <line x1="400" y1="68" x2="400" y2="175" class="sensor-beam" id="beam2"/>

          <!-- รูปรถ Top-View สไตล์ Local (ช่อง 2) -->
          <g id="car2" class="car" opacity="0">
            <!-- ล้อรถ 4 ข้าง -->
            <rect x="351" y="85" width="6" height="20" rx="2" fill="#0f172a"/>
            <rect x="443" y="85" width="6" height="20" rx="2" fill="#0f172a"/>
            <rect x="351" y="145" width="6" height="20" rx="2" fill="#0f172a"/>
            <rect x="443" y="145" width="6" height="20" rx="2" fill="#0f172a"/>

            <!-- โครงสร้างตัวรถมนโค้ง -->
            <rect x="356" y="72" width="88" height="110" rx="24" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
            <!-- ตัวถังหลังคา -->
            <rect x="366" y="90" width="68" height="68" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
            <!-- กระจกหน้ามนโค้ง -->
            <path d="M 372 118 C 372 100, 428 100, 428 118 Z" fill="#38bdf8" opacity="0.85"/>
            <!-- กระจกหลังมนโค้ง -->
            <path d="M 375 142 L 425 142 C 425 152, 375 152, 375 142 Z" fill="#38bdf8" opacity="0.5"/>
            <!-- ไฟหน้าคู่ LED -->
            <circle cx="372" cy="76" r="4" fill="#fff" filter="drop-shadow(0 0 6px #fff)"/>
            <circle cx="428" cy="76" r="4" fill="#fff" filter="drop-shadow(0 0 6px #fff)"/>
            <!-- ไฟท้าย -->
            <rect x="366" y="178" width="18" height="3" rx="1.5" fill="#ef4444" filter="drop-shadow(0 0 3px #ef4444)"/>
            <rect x="416" y="178" width="18" height="3" rx="1.5" fill="#ef4444" filter="drop-shadow(0 0 3px #ef4444)"/>
          </g>

          <!-- ข้อความสถานะด้านล่างช่อง -->
          <text x="400" y="202" text-anchor="middle" class="bay-status" id="status2">--</text>
        </g>

        <!-- แบนเนอร์เตือนเมื่อที่จอดรถเต็ม -->
        <g id="fullBanner" class="full-banner" opacity="0">
          <rect x="120" y="235" width="300" height="42" class="full-banner-bg" rx="8"/>
          <text x="270" y="261" text-anchor="middle" class="full-banner-text">⚠️ PARKING LOT FULL</text>
        </g>
      </svg>
    </section>

    <section class="panel readout-panel">
      <div class="panel-head"><span class="eyebrow">📡 Sensor Telemetry</span></div>
      <div class="readouts">
        <div class="readout-card" id="card1">
          <span class="readout-label">Parking 1 DISTANCE</span>
          <span class="readout-value"><span id="dist1">--</span><small>cm</small></span>
          <span class="readout-tag" id="tag1">CONNECTING</span>
        </div>
        <div class="readout-card" id="card2">
          <span class="readout-label">Parking 2 DISTANCE</span>
          <span class="readout-value"><span id="dist2">--</span><small>cm</small></span>
          <span class="readout-tag" id="tag2">CONNECTING</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    LAST SYNC TIME: <span id="lastUpdate">--:--:--</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
