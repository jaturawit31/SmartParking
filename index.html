<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOW PARKING // 2 Bays</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="paw-pattern-overlay"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🐾</span>
      <div class="brand-text">
        <h1>MEOW PARKING</h1>
        <span class="brand-sub">ESP32 · CAT SPACE MONITOR</span>
      </div>
    </div>
    <div class="topbar-status">
      <!-- บน GitHub Page จะไม่มีปุ่มตั้งค่า (เพราะไม่มี Local WebServer) -->
      <div class="clock" id="clock">--:--:--</div>
      <div class="link-state">
        <span class="dot" id="linkDot"></span>
        <span id="linkLabel">กำลังเรียกเหมียว...</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- ผังพื้นที่แมว -->
    <section class="panel schematic-panel">
      <div class="panel-head">
        <span class="eyebrow">🐱 พื้นที่ของเจ้านาย (2 ช่อง)</span>
        <span class="available-pill" id="availablePill">-- / -- ว่าง</span>
      </div>
      
      <svg viewBox="0 0 540 320" class="schematic">
        <!-- ทางเดิน -->
        <rect x="0" y="140" width="540" height="40" class="road"/>
        <line x1="0" y1="160" x2="540" y2="160" class="road-dash"/>

        <!-- ช่อง 1 -->
        <g id="bay1">
          <rect x="70" y="30" width="150" height="100" rx="15" class="bay-outline"/>
          <text x="145" y="20" text-anchor="middle" class="bay-label">กล่องที่ 1</text>
          <circle cx="145" cy="40" r="4" class="sensor-dot"/>
          <line x1="145" y1="44" x2="145" y2="120" class="sensor-beam" id="beam1"/>
          
          <g id="car1" class="car" opacity="0">
            <!-- หูแมว -->
            <polygon points="105,70 100,45 125,55" class="cat-body"/>
            <polygon points="185,70 190,45 165,55" class="cat-body"/>
            <!-- ตัวแมว -->
            <rect x="95" y="55" width="100" height="55" rx="25" class="cat-body"/>
            <!-- ตา -->
            <circle cx="125" cy="75" r="4" class="cat-face"/>
            <circle cx="165" cy="75" r="4" class="cat-face"/>
            <!-- จมูก/ปาก -->
            <path d="M 140 82 Q 145 88 150 82" class="cat-face" fill="none" stroke-width="2"/>
            <circle cx="145" cy="80" r="2" class="cat-nose"/>
          </g>
          <text x="145" y="150" text-anchor="middle" class="bay-status" id="status1">--</text>
        </g>

        <!-- ช่อง 2 -->
        <g id="bay2">
          <rect x="320" y="30" width="150" height="100" rx="15" class="bay-outline"/>
          <text x="395" y="20" text-anchor="middle" class="bay-label">กล่องที่ 2</text>
          <circle cx="395" cy="40" r="4" class="sensor-dot"/>
          <line x1="395" y1="44" x2="395" y2="120" class="sensor-beam" id="beam2"/>
          
          <g id="car2" class="car" opacity="0">
            <polygon points="355,70 350,45 375,55" class="cat-body"/>
            <polygon points="435,70 440,45 415,55" class="cat-body"/>
            <rect x="345" y="55" width="100" height="55" rx="25" class="cat-body"/>
            <circle cx="375" cy="75" r="4" class="cat-face"/>
            <circle cx="415" cy="75" r="4" class="cat-face"/>
            <path d="M 390 82 Q 395 88 400 82" class="cat-face" fill="none" stroke-width="2"/>
            <circle cx="395" cy="80" r="2" class="cat-nose"/>
          </g>
          <text x="395" y="150" text-anchor="middle" class="bay-status" id="status2">--</text>
        </g>

        <!-- ป้าย FULL -->
        <g id="fullBanner" class="full-banner" opacity="0">
          <rect x="120" y="200" width="300" height="60" rx="30" class="full-banner-bg"/>
          <text x="270" y="238" text-anchor="middle" class="full-banner-text">🐾 แมวเต็มกล่องแล้วเมี้ยว~</text>
        </g>
      </svg>
    </section>

    <!-- ข้อมูลระยะเซ็นเซอร์ -->
    <section class="panel readout-panel">
      <div class="panel-head"><span class="eyebrow">🧶 ระยะเซ็นเซอร์</span></div>
      <div class="readouts">
        <div class="readout-card" id="card1">
          <span class="readout-label">ช่องที่ 1</span>
          <span class="readout-value"><span id="dist1">--</span><small>cm</small></span>
          <span class="readout-tag" id="tag1">รอข้อมูล</span>
        </div>
        <div class="readout-card" id="card2">
          <span class="readout-label">ช่องที่ 2</span>
          <span class="readout-value"><span id="dist2">--</span><small>cm</small></span>
          <span class="readout-tag" id="tag2">รอข้อมูล</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    อัปเดตล่าสุด: <span id="lastUpdate">--</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
